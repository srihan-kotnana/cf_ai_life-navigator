<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>life navigator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>🧭 life navigator</h1>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="dump your thoughts or ask for a plan…" />
      <button type="submit">send</button>
    </form>
    <div class="privacy-actions">
      <button id="export-data" type="button">export my data</button>
      <button id="delete-data" class="danger" type="button">delete my data</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
